{% extends "base.html" %}
{% block title %}Login ONG{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <i data-lucide="building-2" class="icon" style="width: 40px; height: 40px; color: #36946f;"></i>
            <h2 style="font-size: 1.5rem; margin-top: 8px;">Acesso ONG</h2>
        </div>
        
        <form method="POST">
            <div style="margin-bottom: 16px;">
                <label>Usuário</label>
                <input type="text" name="username" required placeholder="Seu nome de usuário">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label>Senha</label>
                <input type="password" name="senha" required placeholder="••••••">
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">Entrar</button>
        </form>
        
        <p style="margin-top: 20px; text-align: center; font-size: 0.8rem;">
            Não tem cadastro? <a href="/ong/cadastrar" style="color: #36946f;">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
